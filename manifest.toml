format = 1

[package]
provenance = "built-in"
id = "org.mochios.terminal"
name = "Terminal"
version = "0.1.0"
revision = 1
vendor = "mochiOS"
kind = "application"
architecture = "x86_64"
abi = "mochios-1"

[[binary]]
path = "/applications/Terminal.app/entry.elf"
kind = "application"
requires = [
    "fs.read.all",
    "fs.write.tmp",
    "fs.write.user",
    "ipc.client",
    "ipc.server",
    "process.spawn",
    "window.create",
]
