[workspace]

[package]
name = "terminal"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
viewkit = "2.0.0"
appcore = { package = "mochios-appcore", path = "../../tools/devkit/crates/appcore" }
vt100 = "=0.18.1"
serde = { version = "1", features = ["derive"] }
toml = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = { git = "https://github.com/mochiOS/libc", package = "libc" }

[target.'cfg(target_os = "mochios")'.dependencies]
libc = { git = "https://github.com/mochiOS/libc", package = "libc" }
mochi-user-platform = { git = "https://github.com/mochiOS/syscalls", package = "mochi-user-platform", default-features = false, features = ["std"] }
mochios-posix-client = { git = "https://github.com/mochiOS/syscalls", package = "mochios-posix-client", default-features = false, features = ["syscall-endpoint"] }
mochios-posix-protocol = { git = "https://github.com/mochiOS/syscalls", package = "mochios-posix-protocol" }

[[bin]]
name = "terminal"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("mochios"))', 'cfg(mochios_pty_launch_probe_310)'] }
